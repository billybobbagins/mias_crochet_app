<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mia's Crochet Patterns</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf5ee;
    --bg-alt:#f1e6d8;
    --card:#ffffff;
    --ink:#3d2f28;
    --ink-soft:#7a6a5f;
    --border:#e6d8c6;
    --accent:#d97a5f;
    --accent-ink:#ffffff;
    --sage:#7c9a78;
    --sage-ink:#ffffff;
    --danger:#c85c5c;
    --shadow:0 2px 8px rgba(90,60,40,.08), 0 1px 2px rgba(90,60,40,.06);
    --radius:16px;
    --grid-line:#d9d9d9;
    --grid-label-bg:#f0f0f0;
    --grid-label-hi-bg:#dcdcdc;
    --grid-label-hi-ink:#3d2f28;
    --cell-blank-bg: repeating-conic-gradient(#ffffff 0% 25%, #ececec 0% 50%) 50% / 10px 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#221c17;
      --bg-alt:#2a221b;
      --card:#2e261f;
      --ink:#f1e7db;
      --ink-soft:#b8a99a;
      --border:#4a3d31;
      --accent:#e08a6d;
      --accent-ink:#241813;
      --sage:#8fb08a;
      --sage-ink:#132013;
      --danger:#e18080;
      --shadow:0 2px 10px rgba(0,0,0,.35);
      --grid-line:#454545;
      --grid-label-bg:#2b2b2b;
      --grid-label-hi-bg:#3a3a3a;
      --grid-label-hi-ink:#f1e7db;
      --cell-blank-bg: repeating-conic-gradient(#262626 0% 25%, #2e2e2e 0% 50%) 50% / 10px 10px;
    }
  }
  :root[data-theme="dark"]{
    --bg:#221c17;
    --bg-alt:#2a221b;
    --card:#2e261f;
    --ink:#f1e7db;
    --ink-soft:#b8a99a;
    --border:#4a3d31;
    --accent:#e08a6d;
    --accent-ink:#241813;
    --sage:#8fb08a;
    --sage-ink:#132013;
    --danger:#e18080;
    --shadow:0 2px 10px rgba(0,0,0,.35);
    --grid-line:#454545;
    --grid-label-bg:#2b2b2b;
    --grid-label-hi-bg:#3a3a3a;
    --grid-label-hi-ink:#f1e7db;
    --cell-blank-bg: repeating-conic-gradient(#262626 0% 25%, #2e2e2e 0% 50%) 50% / 10px 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  button{font-family:inherit;}
  h1,h2,h3{font-weight:800;margin:0;}
  .app-header{
    padding:10px 20px;
    background:var(--bg-alt);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{font-size:18px;}
  main{max-width:1600px;margin:0 auto;padding:20px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);color:var(--ink);font-weight:700;font-size:14px;
    cursor:pointer;transition:transform .08s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .btn-sage{background:var(--sage);color:var(--sage-ink);border-color:transparent;}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:5px 11px;font-size:12.5px;}
  .btn-icon{padding:8px;border-radius:10px;line-height:1;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}

  /* Home */
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .project-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
  }
  .project-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s ease;
    display:flex;flex-direction:column;gap:6px;position:relative;
  }
  .project-card:hover{transform:translateY(-2px);}
  .project-card h3{font-size:16px;}
  .project-card .meta{color:var(--ink-soft);font-size:12.5px;}
  .yarn-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .yarn-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s ease;
    display:flex;flex-direction:column;gap:4px;position:relative;
  }
  .yarn-card:hover{transform:translateY(-2px);}
  .yarn-card h3{font-size:13.5px;}
  .yarn-card .meta{color:var(--ink-soft);font-size:11px;}
  .yarn-card .card-actions{position:absolute;top:6px;right:6px;opacity:0;transition:opacity .15s;}
  .yarn-card:hover .card-actions{opacity:1;}
  .new-card{
    border:2px dashed var(--border);border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--ink-soft);cursor:pointer;min-height:120px;font-weight:700;background:transparent;
  }
  .new-card:hover{color:var(--accent);border-color:var(--accent);}
  .new-card .plus{font-size:28px;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:44px;margin-bottom:8px;}

  /* Project view */
  .crumb{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .project-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px;}
  .project-title-row h2{font-size:24px;}
  .title-actions{display:flex;gap:8px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--border);margin-bottom:18px;padding-bottom:0;}
  .tab{
    padding:9px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:700;font-size:14px;
    color:var(--ink-soft);border:1px solid transparent;border-bottom:none;background:transparent;
  }
  .tab.active{color:var(--accent);background:var(--card);border-color:var(--border);position:relative;top:2px;}
  .tab-add{color:var(--ink-soft);font-size:18px;padding:9px 14px;}
  .tab-add:hover{color:var(--accent);}

  /* Pattern view */
  .pattern-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .pattern-header h3{font-size:20px;}
  .pattern-header .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pattern-layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}

  .toolbar{
    display:flex;flex-direction:column;gap:10px;margin-bottom:14px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;box-shadow:var(--shadow);
  }
  .toolbar-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
  .toolbar-group{display:flex;align-items:center;gap:6px;}
  .toolbar-sep{width:1px;align-self:stretch;background:var(--border);}
  .icon-btn{
    width:36px;height:36px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    border-radius:10px;border:1px solid var(--border);background:var(--bg-alt);cursor:pointer;color:var(--ink);padding:0;
  }
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .icon-btn[disabled]{opacity:.4;cursor:not-allowed;}
  .icon-btn-danger{color:var(--danger);border-color:var(--danger);}
  .icon-btn-inline{
    width:22px;height:22px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--ink-soft);padding:0;
    vertical-align:middle;
  }
  .icon-btn-inline:hover{color:var(--ink);background:var(--bg-alt);}
  .icon-btn-inline svg{width:14px;height:14px;}
  .color-btn{width:36px;height:36px;flex-shrink:0;border-radius:10px;border:2px solid var(--border);cursor:pointer;padding:0;}
  .color-btn-empty{background:var(--bg-alt);border-style:dashed;}
  .icon-btn-greyed{opacity:.35;}
  .dropdown-wrap{position:relative;}
  .dropdown-panel{
    position:absolute;top:calc(100% + 8px);left:0;z-index:40;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 12px 30px rgba(0,0,0,.18);padding:14px;min-width:240px;
  }
  .palette-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .palette-swatch{
    position:relative;width:34px;height:34px;border-radius:9px;border:2px solid var(--border);cursor:pointer;
  }
  .palette-swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent);}
  .add-color-row{display:flex;gap:6px;align-items:center;}
  .add-color-row input[type=text]{
    flex:1;min-width:0;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:13px;
  }
  .add-color-row input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:700;}
  .field select, .field input[type=number]{
    width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:13px;
  }
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}

  .grid-scroll{
    overflow:auto;max-width:100%;max-height:70vh;padding:6px;background:var(--card);
    border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  }
  .grid-wrapper{
    display:grid;gap:0;width:max-content;user-select:none;touch-action:none;
    border-top:1px solid var(--grid-line);border-left:1px solid var(--grid-line);
  }
  .grid-wrapper.pan-mode{touch-action:pan-x pan-y;}
  .corner{background:var(--card);border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);}
  .lbl{
    background:var(--grid-label-bg);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--ink-soft);
    border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);
  }
  .lbl-hi{color:var(--grid-label-hi-ink);background:var(--grid-label-hi-bg);font-weight:800;}
  .lbl.line-current{outline:2px solid var(--sage);outline-offset:-2px;}
  .cell{background:#fff;cursor:pointer;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);}
  .cell.cell-blank{background:var(--cell-blank-bg);}
  .pattern-mode-view .cell{cursor:default;}
  .cell.line-dim{opacity:.35;}
  .lbl.line-dim{opacity:.35;}
  .cell.cell-line-preview{outline:2px solid var(--sage);outline-offset:-2px;}

  .guide-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);}
  .guide-bar .row-indicator{font-weight:800;font-size:15px;min-width:110px;}
  .guide-breakdown{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto;}
  .breakdown-chip{display:flex;align-items:center;gap:5px;background:var(--bg-alt);border-radius:999px;padding:3px 9px 3px 3px;font-size:12px;font-weight:700;}
  .breakdown-chip .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}

  .preset-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .preset-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-alt);border-radius:999px;padding:6px 8px 6px 14px;font-size:13px;font-weight:600;}
  .preset-chip .rm2{cursor:pointer;color:var(--ink-soft);width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;}
  .preset-chip .rm2:hover{background:var(--danger);color:#fff;}
  .yarn-filter-chip{cursor:pointer;border:1px solid transparent;padding:6px 12px;}
  .yarn-filter-chip.active{background:var(--accent);color:var(--accent-ink);}
  .yarn-filter-chip.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
  .yarn-pill-picker{display:flex;flex-direction:column;gap:14px;margin-bottom:12px;}
  .yarn-pill-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .yarn-pill-row{
    display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;min-height:38px;max-height:160px;
    overflow:auto;padding:8px;border:1px dashed var(--border);border-radius:10px;
  }
  .yarn-pill{
    display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;
    border:1px solid var(--border);background:var(--bg-alt);cursor:pointer;font-size:12.5px;
    font-weight:600;color:var(--ink);font-family:inherit;
  }
  .yarn-pill .swatch{display:inline-block;width:16px;height:16px;min-width:16px;min-height:16px;border-radius:5px;border:1px solid var(--border);flex-shrink:0;}
  .yarn-pill.selected{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .yarn-pill.selected .swatch{border-color:rgba(255,255,255,.5);}

  .hint{color:var(--ink-soft);font-size:12.5px;line-height:1.5;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(30,20,12,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--card);border-radius:var(--radius);padding:22px;width:100%;max-width:380px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal h3{margin-bottom:14px;}
  .modal .field{margin-bottom:12px;}
  .modal input[type=text]{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  #toast-root{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  }
  .toast{
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;transform:translateY(8px);transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;max-width:340px;width:100%;}
  .login-card h1{font-size:20px;margin:10px 0 4px;}
  .login-card input[type=password]{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:15px;margin-top:14px;text-align:center;}

  a{color:var(--accent);}

  @media (max-width:720px){
    .guide-breakdown{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";

  /* ---------- theme (device-local UI preference, not synced) ---------- */
  var THEME_KEY = 'miasCrochetApp.theme';
  function applyTheme(theme){
    if(theme==='light' || theme==='dark'){
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }
  function getTheme(){
    try{ return localStorage.getItem(THEME_KEY) || 'system'; }catch(e){ return 'system'; }
  }
  function setTheme(theme){
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    applyTheme(theme);
  }
  applyTheme(getTheme());

  /* ---------- firebase ---------- */
  var firebaseConfig = {
    apiKey: "AIzaSyDhm442NE_V62IFidTO5j3eEjfiHg_0baE",
    authDomain: "mias-crochet-patterns.firebaseapp.com",
    projectId: "mias-crochet-patterns",
    storageBucket: "mias-crochet-patterns.firebasestorage.app",
    messagingSenderId: "463256704537",
    appId: "1:463256704537:web:85c16a6d26af758f92bc88"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var firestoreDB = firebase.firestore();
  firestoreDB.enablePersistence().catch(function(err){
    console.warn('Offline persistence unavailable:', err.code);
  });
  // Two fixed Firebase Auth accounts sharing this app, each with its own
  // Firestore data (isolated by uid via firestore.rules).
  var LOGIN_ACCOUNTS = [
    {id:'mia', label:'Mia', email:'miajade.kha@gmail.com'},
    {id:'dev', label:'Developer', email:'btattersall13@gmail.com'}
  ];
  function isDevAccount(){
    var devAccount = LOGIN_ACCOUNTS.filter(function(a){ return a.id==='dev'; })[0];
    return !!(devAccount && auth.currentUser && auth.currentUser.email === devAccount.email);
  }
  var LEGACY_LOCAL_KEY = 'miasCrochetApp.v1';
  var CELL_SIZE_MIN = 4, CELL_SIZE_MAX = 44;
  var ASPECT_PRESETS = [
    {label:'Taller (2:3)', value:0.6667},
    {label:'Tall (5:6)', value:0.8333},
    {label:'Square (1:1)', value:1},
    {label:'Wide (6:5)', value:1.2},
    {label:'Wider (3:2)', value:1.5}
  ];

  /* ---------- helpers ---------- */
  function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  // Picks a cell size that fits the pattern's full width into roughly the
  // available viewport width, so a pattern starts fully visible with no
  // horizontal scroll needed — used at creation time and on grid resize.
  // Only considers width (cols), never rows: height is left to naturally
  // follow from that width and the aspect ratio, per design; a tall result
  // scrolls within the height-capped .grid-scroll viewport instead.
  function fitCellSize(cols, aspect){
    var availableWidth = Math.max(200, (window.innerWidth||800) - 80);
    var approxLabelPx = 24;
    var perCol = (availableWidth - approxLabelPx*2) / Math.max(1,cols);
    var raw = perCol / (aspect||1);
    return clamp(Math.round(raw), CELL_SIZE_MIN, CELL_SIZE_MAX);
  }
  // At small effective pixel sizes a number in every single row/column
  // label would overlap or blur into noise, so only every Nth number is
  // shown (still always the first and last) — the same way a graph's axis
  // ticks thin out as you zoom out.
  function labelStepForSize(px){
    if(px >= 12) return 1;
    if(px >= 6) return 5;
    return 10;
  }
  function fmtDate(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    }catch(e){ return ''; }
  }

  /* ---------- toast (transient, non-blocking notification) ---------- */
  function showToast(message){
    var root = document.getElementById('toast-root');
    if(!root) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    root.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setTimeout(function(){
      el.classList.remove('show');
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 250);
    }, 2200);
  }

  /* ---------- icons (inline SVG, monochrome via currentColor) ---------- */
  var ICON_SVG_ATTRS = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';

  /* ---------- pattern helpers ---------- */
  function blankCells(rows, cols){
    var cells = [];
    for(var i=0;i<rows;i++){
      var row = [];
      for(var j=0;j<cols;j++) row.push(null);
      cells.push(row);
    }
    return cells;
  }
  function resizeCells(oldCells, oldRows, oldCols, newRows, newCols){
    var out = blankCells(newRows, newCols);
    var r = Math.min(oldRows, newRows), c = Math.min(oldCols, newCols);
    for(var i=0;i<r;i++) for(var j=0;j<c;j++) out[i][j] = oldCells[i][j];
    return out;
  }
  function rowDisplay(pattern, i){ return pattern.numbering.flipV ? (pattern.rows - i) : (i+1); }
  function colDisplay(pattern, j){ return pattern.numbering.flipH ? (pattern.cols - j) : (j+1); }
  function isHighlighted(display, side, oddSide){ return (display % 2 === 1) === (side === oddSide); }
  function getRowOrder(pattern){
    var arr = [];
    for(var i=0;i<pattern.rows;i++) arr.push(i);
    return pattern.numbering.flipV ? arr.slice().reverse() : arr;
  }
  function getColOrder(pattern){
    var arr = [];
    for(var j=0;j<pattern.cols;j++) arr.push(j);
    return pattern.numbering.flipH ? arr.slice().reverse() : arr;
  }
  function isVerticalStitch(pattern){ return pattern.stitchDirection === 'vertical'; }
  function getGuideOrder(pattern){
    return isVerticalStitch(pattern) ? getColOrder(pattern) : getRowOrder(pattern);
  }

  // Bresenham's line algorithm — every grid cell a straight line between
  // two points "passes through," including arbitrary diagonals (not just
  // same-row/same-column lines).
  function bresenhamLine(r0,c0,r1,c1){
    var cells = [];
    var dr = Math.abs(r1-r0), dc = Math.abs(c1-c0);
    var sr = r0<r1 ? 1 : -1, sc = c0<c1 ? 1 : -1;
    var err = dr-dc;
    var r=r0, c=c0;
    while(true){
      cells.push([r,c]);
      if(r===r1 && c===c1) break;
      var e2 = 2*err;
      if(e2 > -dc){ err -= dc; r += sr; }
      if(e2 < dr){ err += dr; c += sc; }
    }
    return cells;
  }

  function touch(project){ project.updatedAt = new Date().toISOString(); }

  /* ---------- flood fill ---------- */
  function bucketFill(pattern, startRow, startCol, color){
    var target = pattern.cells[startRow][startCol];
    if(target === color) return;
    var stack = [[startRow,startCol]];
    var seen = new Set();
    seen.add(startRow+','+startCol);
    while(stack.length){
      var cur = stack.pop();
      var r=cur[0], c=cur[1];
      pattern.cells[r][c] = color;
      var neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      for(var k=0;k<neighbors.length;k++){
        var nr=neighbors[k][0], nc=neighbors[k][1];
        if(nr<0||nc<0||nr>=pattern.rows||nc>=pattern.cols) continue;
        var key = nr+','+nc;
        if(seen.has(key)) continue;
        if(pattern.cells[nr][nc] === target){
          seen.add(key);
          stack.push([nr,nc]);
        }
      }
    }
  }

  // Zooms a pattern's cell size while keeping the content under (anchorX,
  // anchorY) — viewport coordinates, e.g. a mouse cursor or a pinch
  // midpoint — visually fixed in place, instead of always anchoring to the
  // scroll container's top-left corner. Defaults to the viewport's own
  // center when no anchor point is given (button-triggered zoom).
  function zoomPatternAroundPoint(project, pattern, newSize, anchorX, anchorY, skipPersist){
    var oldSize = pattern.cellSize;
    if(newSize === oldSize) return;
    var scrollEl = document.querySelector('.grid-scroll');
    var rect = scrollEl ? scrollEl.getBoundingClientRect() : null;
    var ax = anchorX, ay = anchorY;
    if(rect && (ax==null || ay==null)){ ax = rect.left + rect.width/2; ay = rect.top + rect.height/2; }
    var oldScrollLeft = scrollEl ? scrollEl.scrollLeft : 0;
    var oldScrollTop = scrollEl ? scrollEl.scrollTop : 0;
    pattern.cellSize = newSize;
    if(!skipPersist){ touch(project); persist(project, pattern); }
    render();
    if(scrollEl && rect){
      var scale = newSize/oldSize;
      var newScrollEl = document.querySelector('.grid-scroll');
      if(newScrollEl){
        var contentX = oldScrollLeft + (ax - rect.left);
        var contentY = oldScrollTop + (ay - rect.top);
        newScrollEl.scrollLeft = contentX*scale - (ax - rect.left);
        newScrollEl.scrollTop = contentY*scale - (ay - rect.top);
      }
    }
  }

  // A yarn matches the active filter set only if it matches every chosen
  // {category,value} pair — strict AND across all of them, regardless of
  // category. In practice this also naturally prevents picking two values
  // from the same category (a yarn only has one Material, say, so once one
  // value is chosen the others would all yield zero matches and grey out)
  // without needing separate same-category-OR logic.
  function yarnMatchesFilters(y, filters){
    return filters.every(function(f){ return (y[f.category]||'') === f.value; });
  }
  function yarnStashFilterWouldMatch(category, value){
    var testFilters = state.yarnStashFilters.concat([{category:category, value:value}]);
    return db.yarnStash.some(function(y){ return yarnMatchesFilters(y, testFilters); });
  }

        var disabled = !active && !yarnStashFilterWouldMatch(cat[0], opt);
        var cls = 'preset-chip yarn-filter-chip'+(active?' active':'')+(disabled?' disabled':'');
        html += '<span class="'+cls+'" data-action="toggle-yarn-filter" data-category="'+cat[0]+'" data-value="'+escapeHtml(opt)+'">'+escapeHtml(opt)+'</span>';

  // Renders two pill pools — "Selected" and "Available" — instead of a
  // checkbox list: clicking a pill moves it between them (toggle-yarn-pill
  // action, pure DOM manipulation, no re-render) so what's chosen is
  // always visually separated from what isn't. readCheckedYarnIds() below

  // selected, so every save/add handler that calls it needed no changes.
  function yarnChecklistHtml(checkedIds, pool){
    pool = pool || db.yarnStash;
    if(!pool.length){
      return '<div class="hint" style="margin-bottom:10px;">No yarn available yet — add one below.</div>';
    }
    var sorted = pool.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });

    var available = sorted.filter(function(y){ return checkedIds.indexOf(y.id)===-1; });
    var html = '<div class="yarn-pill-picker">';
    html += '<div class="yarn-pill-section"><div class="yarn-pill-label">Selected</div>';
    html += '<div class="yarn-pill-row yarn-pill-selected">';
    html += selected.length ? selected.map(function(y){ return yarnPillHtml(y,true); }).join('') : '<span class="hint">None yet</span>';
    html += '</div></div>';
    html += '<div class="yarn-pill-section"><div class="yarn-pill-label">Available</div>';
    html += '<div class="yarn-pill-row yarn-pill-available">';
    html += available.length ? available.map(function(y){ return yarnPillHtml(y,false); }).join('') : '<span class="hint">None</span>';
    html += '</div></div>';
    html += '</div>';
    return html;
  }
  function readCheckedYarnIds(root){

  function renderGuideBar(project, pattern){
    if(!state.guideActive) return '';
    var vertical = isVerticalStitch(pattern);
    var unitLabel = vertical ? 'Column' : 'Row';
    var total = vertical ? pattern.cols : pattern.rows;
    var html = '<div class="guide-bar">';
    var order = getGuideOrder(pattern);
    var pos = clamp(state.guidePos, 0, order.length-1);
    state.guidePos = pos;
    var lineIdx = order[pos];
    if(state.guideResumed){
      html += '<span class="hint">Continuing from last session</span>';
      html += '<button class="btn btn-sm btn-ghost" data-action="guide-revert">Revert to beginning</button>';
    }
    html += '<button class="btn btn-icon btn-sm" data-action="guide-prev" '+(pos<=0?'disabled':'')+'>‹ Prev</button>';
    html += '<div class="row-indicator">'+unitLabel+' '+(pos+1)+' of '+total+'</div>';
    html += '<button class="btn btn-icon btn-sm" data-action="guide-next" '+(pos>=order.length-1?'disabled':'')+'>Next ›</button>';
    html += '<button class="btn btn-sm btn-ghost" data-action="guide-toggle">✕ Stop</button>';

    var counts = {};
    if(vertical){
      for(var i=0;i<pattern.rows;i++){
        var hexV = pattern.cells[i][lineIdx];
        if(hexV) counts[hexV] = (counts[hexV]||0)+1;
      }
    } else {
      for(var j=0;j<pattern.cols;j++){
        var hex = pattern.cells[lineIdx][j];
        if(hex) counts[hex] = (counts[hex]||0)+1;
      }
    }
    var entries = Object.keys(counts).map(function(hex){ return {hex:hex, n:counts[hex]}; }).sort(function(a,b){ return b.n-a.n; });
    if(entries.length){
      html += '<div class="guide-breakdown">';
      entries.forEach(function(e){
        var pc = db.yarnStash.find(function(y){ return y.hex.toLowerCase()===e.hex.toLowerCase(); });
        var label = pc ? pc.name : e.hex;
        html += '<div class="breakdown-chip"><span class="dot" style="background:'+e.hex+'"></span>'+escapeHtml(label)+' × '+e.n+'</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

    html += '<div class="field"><label>Highlight odd columns on</label><select data-action="set-draft-numbering" data-field="oddH">';

    html += '<option value="bottom"'+(draft.numbering.oddH==='bottom'?' selected':'')+'>Bottom side</option>';
    html += '</select></div>';

    var closest = ASPECT_PRESETS[0];
    ASPECT_PRESETS.forEach(function(p){ if(Math.abs(p.value-draft.aspect) < Math.abs(closest.value-draft.aspect)) closest = p; });
    html += '<div class="field"><label>Cell Height:Width Ratio</label><select data-action="set-draft-aspect">';

    html += '<div class="field"><label>Stitch direction</label><select data-action="set-draft-direction">';

    html += '<button class="btn btn-sm btn-primary" data-action="save-pattern-settings">Save</button>';
    html += '</div>';

  function renderGrid(project, pattern, editable){
    var cellW = Math.round(pattern.cellSize * pattern.aspect);
    var cellH = pattern.cellSize;
    var lblSize = clamp(pattern.cellSize, 20, 30);
    var colStep = labelStepForSize(cellW);
    var rowStep = labelStepForSize(cellH);
    function showColLabel(cd){ return cd===1 || cd===pattern.cols || cd % colStep === 0; }
    function showRowLabel(rd){ return rd===1 || rd===pattern.rows || rd % rowStep === 0; }

    var guide = (!editable && state.guideActive);
    var guideVertical = guide && isVerticalStitch(pattern);
    var order = guide ? getGuideOrder(pattern) : null;
    var currentIdx = guide ? order[clamp(state.guidePos,0,order.length-1)] : -1;
    var currentRowIdx = (guide && !guideVertical) ? currentIdx : -1;
    var currentColIdx = guideVertical ? currentIdx : -1;

    var colsTemplate = lblSize+'px repeat('+pattern.cols+', '+cellW+'px) '+lblSize+'px';
    var rowsTemplate = lblSize+'px repeat('+pattern.rows+', '+cellH+'px) '+lblSize+'px';

    var panMode = !editable || state.activeTool==='pan';
    var html = '<div class="grid-wrapper'+(panMode?' pan-mode':'')+'" id="grid-wrapper" data-rows="'+pattern.rows+'" data-cols="'+pattern.cols+'" style="grid-template-columns:'+colsTemplate+';grid-template-rows:'+rowsTemplate+';">';

    // top row: corner + column labels + corner
    html += '<div class="corner"></div>';
    for(var j=0;j<pattern.cols;j++){
      var cd = colDisplay(pattern,j);
      var hi = isHighlighted(cd,'top',pattern.numbering.oddH);
      var colGuideClass = guideVertical ? (j===currentColIdx ? ' line-current' : ' line-dim') : '';
      html += '<div class="lbl'+(hi?' lbl-hi':'')+colGuideClass+'">'+(showColLabel(cd)?cd:'')+'</div>';
    }
    html += '<div class="corner"></div>';

    // middle rows
    for(var i=0;i<pattern.rows;i++){
      var rd = rowDisplay(pattern,i);
      var hiL = isHighlighted(rd,'left',pattern.numbering.oddV);
      var hiR = isHighlighted(rd,'right',pattern.numbering.oddV);
      var rowGuideClass = (guide && !guideVertical) ? (i===currentRowIdx ? ' line-current' : ' line-dim') : '';

      html += '<div class="lbl'+(hiL?' lbl-hi':'')+rowGuideClass+'">'+(showRowLabel(rd)?rd:'')+'</div>';
      for(var jj=0; jj<pattern.cols; jj++){
        var hex = pattern.cells[i][jj];
        var blank = !hex;
        var cellGuideClass = guideVertical ? (jj===currentColIdx ? ' line-current' : ' line-dim') : rowGuideClass;
        html += '<div class="cell'+(blank?' cell-blank':'')+cellGuideClass+'" data-row="'+i+'" data-col="'+jj+'"'+(hex?' style="background:'+hex+'"':'')+'></div>';
      }
      html += '<div class="lbl'+(hiR?' lbl-hi':'')+rowGuideClass+'">'+(showRowLabel(rd)?rd:'')+'</div>';
    }

    // bottom row
    html += '<div class="corner"></div>';
    for(var j2=0;j2<pattern.cols;j2++){
      var cd2 = colDisplay(pattern,j2);
      var hi2 = isHighlighted(cd2,'bottom',pattern.numbering.oddH);
      var colGuideClass2 = guideVertical ? (j2===currentColIdx ? ' line-current' : ' line-dim') : '';
      html += '<div class="lbl'+(hi2?' lbl-hi':'')+colGuideClass2+'">'+(showColLabel(cd2)?cd2:'')+'</div>';
    }
    html += '<div class="corner"></div>';

    html += '</div>';
    return html;
  }

  /* ================= ACTIONS ================= */
  function newProject(name, yarnIds){
    var p = {
      id: uid(),
      name: name || 'Untitled Project',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      yarnIds: yarnIds || [],
      patterns: []
    };
    db.projects.push(p);
    persist(p);
    state.view='project'; state.projectId=p.id; state.patternId=null;
    render();
  }

  function newPattern(project, name, rows, cols, yarnIds){
    rows = clamp(parseInt(rows,10)||20,1,100);
    cols = clamp(parseInt(cols,10)||20,1,100);
    var pt = {
      id: uid(),
      name: name || 'Untitled Pattern',
      rows: rows, cols: cols,
      cellSize: fitCellSize(cols, 1),
      aspect: 1,
      cells: blankCells(rows, cols),
      numbering: {flipV:false, flipH:false, oddV:'left', oddH:'top'},
      stitchDirection: 'horizontal',
      guidePos: 0,
      yarnIds: yarnIds || (project.yarnIds||[]).slice(),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    project.patterns.push(pt);
    touch(project);
    persist(project, pt);
    state.patternId = pt.id;
    state.patternMode = 'edit';
    resetUndoHistory();
    syncActiveColorToPattern(pt);
    render();
  }

  function paintCell(project, pattern, row, col){
    if(row<0||col<0||row>=pattern.rows||col>=pattern.cols) return;
    var color = state.activeTool === 'erase' ? null : state.activeColor;
    if(state.activeTool === 'bucket'){
      if(pattern.cells[row][col] === color) return;
      pushUndoSnapshot(pattern);
      bucketFill(pattern, row, col, color);
      return;
    }
    if(pattern.cells[row][col] === color) return;
    pattern.cells[row][col] = color;
    // direct DOM update for smooth dragging, full save/re-render happens on pointerup
    var wrapper = document.getElementById('grid-wrapper');
    if(wrapper){
      var cellEl = wrapper.querySelector('.cell[data-row="'+row+'"][data-col="'+col+'"]');
      if(cellEl){
        if(color){ cellEl.style.background = color; cellEl.classList.remove('cell-blank'); }
        else { cellEl.style.background=''; cellEl.classList.add('cell-blank'); }
      }
    }
  }

  /* ================= EVENT WIRING ================= */
  document.addEventListener('click', function(e){
    if(state.colorPickerOpen && !e.target.closest('.dropdown-wrap')){
      state.colorPickerOpen = false;
      render();
    }
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');

    switch(action){
      case 'new-project': openNewProjectModal(); break;
      case 'modal-cancel': state.yarnAddReturn = null; state.addProjectYarnReturn = null; closeModal(); break;
      case 'modal-backdrop': if(e.target===t){ state.yarnAddReturn = null; state.addProjectYarnReturn = null; closeModal(); } break;
      case 'modal-create-project': {
        var nameEl = document.getElementById('modal-project-name');
        var name = nameEl ? nameEl.value.trim() : '';
        var npyContainer = document.getElementById('new-project-yarn-checklist');
        var npYarnIds = npyContainer ? readCheckedYarnIds(npyContainer) : [];
        closeModal();
        newProject(name, npYarnIds);
        break;
      }
      case 'modal-create-pattern': {
        var project = getProject(state.projectId);
        if(!project) break;
        var n = document.getElementById('modal-pattern-name').value.trim();
        var r = document.getElementById('modal-pattern-rows').value;
        var c = document.getElementById('modal-pattern-cols').value;
        var nptyContainer = document.getElementById('new-pattern-yarn-checklist');
        var nptYarnIds = nptyContainer ? readCheckedYarnIds(nptyContainer) : null;
        closeModal();
        newPattern(project, n, r, c, nptYarnIds);
        break;
      }
      case 'open-project': {
        state.view='project'; state.projectId=t.getAttribute('data-id'); state.patternId=null; state.patternMode='view'; state.guideActive=false;
        render();
        break;
      }
      case 'go-home': state.view='home'; render(); break;
      case 'open-yarnstash': state.view='yarnstash'; render(); break;
      case 'open-settings': state.view='settings'; render(); break;
      case 'set-settings-tab': state.settingsTab = t.getAttribute('data-tab'); render(); break;
      case 'set-theme': setTheme(t.getAttribute('data-theme')); render(); break;
      case 'wipe-my-data': {
        var wipeEmail = auth.currentUser ? auth.currentUser.email : 'this account';
        if(confirm('Permanently delete ALL projects, patterns, and yarn for '+wipeEmail+'? This cannot be undone.')){
          renderLoadingScreen('Wiping data…');
          wipeAllMyData().then(function(){
            return loadEverythingFromFirestore();
          }).then(function(){
            state.view='home'; state.projectId=null; state.patternId=null;
            render();
          }).catch(function(err){
            console.error('Wipe failed', err);
            alert('Wipe failed — check your connection and try again.');
            render();
          });
        }
        break;
      }
      case 'open-add-yarn': openYarnModal(null); break;
      case 'edit-yarn': openYarnModal(t.getAttribute('data-id')); break;
      case 'modal-save-yarn': {
        var yid = t.getAttribute('data-id');
        var nameEl3 = document.getElementById('yarn-name');
        var yname = nameEl3.value.trim();
        if(!yname){ alert('Please enter a yarn name.'); break; }
        var yhex = document.getElementById('yarn-hex').value;
        var yfields = {};
        YARN_PRESET_CATEGORIES.forEach(function(cat){
          yfields[cat[0]] = document.getElementById('yarn-'+cat[0]).value || null;
        });
        var savedYarnId = yid;
        if(yid){
          var existingYarn = getYarn(yid);
          if(existingYarn){
            existingYarn.name = yname; existingYarn.hex = yhex;
            existingYarn.brand = yfields.brand; existingYarn.material = yfields.material;
            existingYarn.size = yfields.size; existingYarn.hookSize = yfields.hookSize;
            existingYarn.updatedAt = new Date().toISOString();
            saveYarnDoc(existingYarn);
          }
        } else {
          var newYarn = {
            id: uid(), name: yname, hex: yhex,
            brand: yfields.brand, material: yfields.material, size: yfields.size, hookSize: yfields.hookSize,
            createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
          };
          db.yarnStash.push(newYarn);
          saveYarnDoc(newYarn);
          savedYarnId = newYarn.id;
        }
        if(!reopenYarnReturnModal(savedYarnId)){
          closeModal();
          render();
        }
        break;
      }
      case 'delete-yarn': {
        e.stopPropagation();
        var dyid = t.getAttribute('data-id');
        var dyarn = getYarn(dyid);
        if(dyarn && confirm('Delete "'+dyarn.name+'" from your Yarn Stash? It will also be removed from any project/pattern yarn lists that include it (cells already painted with it keep their color).')){
          db.yarnStash = db.yarnStash.filter(function(y){ return y.id!==dyid; });
          deleteYarnRemote(dyid);
          db.projects.forEach(function(p){
            if(p.yarnIds && p.yarnIds.indexOf(dyid)!==-1){
              p.yarnIds = p.yarnIds.filter(function(x){ return x!==dyid; });
              saveProjectDoc(p);
            }
            p.patterns.forEach(function(pt){
              if(pt.yarnIds && pt.yarnIds.indexOf(dyid)!==-1){
                pt.yarnIds = pt.yarnIds.filter(function(x){ return x!==dyid; });
                savePatternDoc(p, pt);
              }
            });
          });
          closeModal();
          render();
        }
        break;
      }
      case 'add-preset-option': {
        var addCat = t.getAttribute('data-category');
        var addInput = document.getElementById('new-preset-'+addCat);
        var addVal = addInput.value.trim();
        if(!addVal) break;
        if(!db.yarnPresets[addCat]) db.yarnPresets[addCat] = [];
        if(db.yarnPresets[addCat].indexOf(addVal)===-1){
          db.yarnPresets[addCat].push(addVal);
          savePresetsDoc(db.yarnPresets);
        }
        render();
        break;
      }
      case 'remove-preset-option': {
        var rmCat = t.getAttribute('data-category');
        var rmVal = t.getAttribute('data-value');
        db.yarnPresets[rmCat] = (db.yarnPresets[rmCat]||[]).filter(function(o){ return o!==rmVal; });
        savePresetsDoc(db.yarnPresets);
        render();
        break;
      }
      case 'reset-yarn-presets': {
        if(confirm('Reset all preset option lists (Brand, Material, Size, Hook Size) to the app defaults? This replaces your current lists.')){
          db.yarnPresets = defaultYarnPresets();
          savePresetsDoc(db.yarnPresets);
          render();
        }
        break;
      }
      case 'toggle-yarn-filter': {
        var tfCat = t.getAttribute('data-category'), tfVal = t.getAttribute('data-value');
        var tfIdx = -1;
        for(var tfi=0; tfi<state.yarnStashFilters.length; tfi++){
          if(state.yarnStashFilters[tfi].category===tfCat && state.yarnStashFilters[tfi].value===tfVal){ tfIdx = tfi; break; }
        }
        if(tfIdx!==-1){
          state.yarnStashFilters.splice(tfIdx,1);
        } else {
          if(!yarnStashFilterWouldMatch(tfCat, tfVal)) break;
          state.yarnStashFilters.push({category:tfCat, value:tfVal});
        }
        render();
        break;
      }
      case 'clear-yarn-filters': state.yarnStashFilters = []; render(); break;
      case 'toggle-yarn-pill': {
        var picker = t.closest('.yarn-pill-picker');
        if(!picker) break;
        var wasSelected = t.classList.contains('selected');
        t.classList.toggle('selected');
        var targetRow = picker.querySelector(wasSelected ? '.yarn-pill-available' : '.yarn-pill-selected');
        var fromRow = t.parentNode;
        if(targetRow){
          var hint = targetRow.querySelector('.hint');
          if(hint) hint.remove();
          targetRow.appendChild(t);
        }
        if(fromRow && !fromRow.querySelector('.yarn-pill')){
          fromRow.innerHTML = '<span class="hint">'+(fromRow.classList.contains('yarn-pill-selected')?'None yet':'None')+'</span>';

      case 'open-add-yarn-from-checklist': {
        var addKind = t.getAttribute('data-kind');
        var addContainer = document.getElementById(t.getAttribute('data-container'));
        var addChecked = addContainer ? readCheckedYarnIds(addContainer) : [];
        var addRet = {kind: addKind, checkedIds: addChecked};

          var npNameEl = document.getElementById('modal-project-name');
          addRet.name = npNameEl ? npNameEl.value : '';
        } else if(addKind==='new-pattern'){
          var nptNameEl = document.getElementById('modal-pattern-name');
          var nptRowsEl = document.getElementById('modal-pattern-rows');
          var nptColsEl = document.getElementById('modal-pattern-cols');
          addRet.name = nptNameEl ? nptNameEl.value : '';
          addRet.rows = nptRowsEl ? nptRowsEl.value : '20';
          addRet.cols = nptColsEl ? nptColsEl.value : '20';

        openYarnModal(null);

      }
      case 'open-project-yarn': openProjectYarnModal(); break;
      case 'save-project-yarn': {
        var spProj = getProject(state.projectId);
        if(!spProj) break;
        var pyContainer = document.getElementById('project-yarn-checklist');
        var newYarnIds = readCheckedYarnIds(pyContainer);
        spProj.yarnIds = newYarnIds;

          if(pt.yarnIds){
            var filtered = pt.yarnIds.filter(function(id){ return newYarnIds.indexOf(id)!==-1; });
            if(filtered.length !== pt.yarnIds.length){ pt.yarnIds = filtered; savePatternDoc(spProj, pt); }
          }
        });
        closeModal();
        render();
        break;
      }
      case 'delete-project': {
        e.stopPropagation();
        var id = t.getAttribute('data-id');
        var p = getProject(id);
        if(p && confirm('Delete project "'+p.name+'" and all its patterns? This cannot be undone.')){

          deleteProjectRemote(id);
          if(state.projectId===id){ state.view='home'; state.projectId=null; }

      case 'new-pattern': openNewPatternModal(); break;
      case 'open-pattern': {
        state.patternId = t.getAttribute('data-id');

      case 'rename-pattern': {
        var pr = getProject(state.projectId);
        var pt2 = getPattern(pr, t.getAttribute('data-id'));
        if(!pt2) break;
        var pn = prompt('Rename pattern', pt2.name);
        if(pn && pn.trim()){ pushUndoSnapshot(pt2); pt2.name = pn.trim(); touch(pr); persist(pr, pt2); render(); }
        break;
      }
      case 'duplicate-pattern': {
        var pr2 = getProject(state.projectId);
        var pt3 = getPattern(pr2, t.getAttribute('data-id'));
        if(!pt3) break;
        var copy = JSON.parse(JSON.stringify(pt3));
        copy.id = uid();
        copy.name = pt3.name + ' (copy)';
        copy.createdAt = new Date().toISOString();
        copy.updatedAt = new Date().toISOString();
        pr2.patterns.push(copy);
        touch(pr2); persist(pr2, copy);
        state.patternId = copy.id;
        resetUndoHistory();
        syncActiveColorToPattern(copy);
        render();
        break;
      }
      case 'delete-pattern': {
        var pr3 = getProject(state.projectId);
        var pt4 = getPattern(pr3, t.getAttribute('data-id'));
        if(!pt4) break;
        if(confirm('Delete pattern "'+pt4.name+'"? This cannot be undone.')){
          pr3.patterns = pr3.patterns.filter(function(x){ return x.id!==pt4.id; });
          touch(pr3); persist(pr3); deletePatternRemote(pr3.id, pt4.id);
          if(state.patternId===pt4.id) state.patternId = pr3.patterns.length ? pr3.patterns[0].id : null;
          render();
        }
        break;
      }
      case 'toggle-mode': {
        state.patternMode = state.patternMode==='edit' ? 'view' : 'edit';
        state.guideActive = false;
        state.colorPickerOpen = false;
        render();
        break;
      }
      case 'set-tool': {
        var newTool = t.getAttribute('data-tool');
        if((newTool==='paint' || newTool==='bucket' || newTool==='line') && !state.activeColor){
          showToast('Select a yarn first');
          break;
        }
        state.activeTool = newTool;
        render();
        break;
      }
      case 'toggle-color-picker': {
        state.colorPickerOpen = !state.colorPickerOpen;
        render();
        break;
      }
      case 'open-pattern-settings': {
        var prTS2 = getProject(state.projectId);
        var patTS2 = getPattern(prTS2, state.patternId);
        if(patTS2){
          state.patternSettingsDraft = {
            rows: patTS2.rows,
            cols: patTS2.cols,
            numbering: JSON.parse(JSON.stringify(patTS2.numbering)),
            aspect: patTS2.aspect,
            direction: patTS2.stitchDirection || 'horizontal'
          };
          state.patternSettingsOpen = true;
          openModal('<div class="modal">'+patternSettingsFieldsHtml(state.patternSettingsDraft)+'</div>');
          state.colorPickerOpen = false;
          render();
        }
        break;
      }
      case 'undo': {
        var undoProj = getProject(state.projectId);
        var undoPat = getPattern(undoProj, state.patternId);
        if(!undoPat || !state.undoStack.length) break;
        state.redoStack.push(snapshotPattern(undoPat));
        var undoSnap = state.undoStack.pop();
        undoPat.name = undoSnap.name; undoPat.rows = undoSnap.rows; undoPat.cols = undoSnap.cols; undoPat.cells = undoSnap.cells;
        touch(undoProj); persist(undoProj, undoPat); render();
        break;
      }
      case 'redo': {
        var redoProj = getProject(state.projectId);
        var redoPat = getPattern(redoProj, state.patternId);
        if(!redoPat || !state.redoStack.length) break;
        state.undoStack.push(snapshotPattern(redoPat));
        var redoSnap = state.redoStack.pop();
        redoPat.name = redoSnap.name; redoPat.rows = redoSnap.rows; redoPat.cols = redoSnap.cols; redoPat.cells = redoSnap.cells;
        touch(redoProj); persist(redoProj, redoPat); render();
        break;
      }
      case 'select-palette-color': {
        state.activeColor = t.getAttribute('data-hex');
        state.colorPickerOpen = false;
        render();
        break;
      }
      case 'open-pattern-yarn': {
        state.colorPickerOpen = false;
        openPatternYarnModal();
        break;
      }
      case 'open-add-project-yarn': {
        var apyContainer = document.getElementById(t.getAttribute('data-container'));
        var apyChecked = apyContainer ? readCheckedYarnIds(apyContainer) : [];
        state.addProjectYarnReturn = {patternCheckedIds: apyChecked};
        openAddProjectYarnModal();
        break;
      }
      case 'cancel-add-project-yarn': {
        var cancelRet = state.addProjectYarnReturn;
        state.addProjectYarnReturn = null;
        openPatternYarnModal(cancelRet ? cancelRet.patternCheckedIds : undefined);
        break;
      }
      case 'save-add-project-yarn': {
        var sapyProj = getProject(state.projectId);
        if(!sapyProj) break;
        var sapyContainer = document.getElementById('add-project-yarn-checklist');
        var newlyPicked = sapyContainer ? readCheckedYarnIds(sapyContainer) : [];
        if(newlyPicked.length){
          var toAdd = newlyPicked.filter(function(id){ return (sapyProj.yarnIds||[]).indexOf(id)===-1; });
          if(toAdd.length){
            sapyProj.yarnIds = (sapyProj.yarnIds||[]).concat(toAdd);
            saveProjectDoc(sapyProj);
          }
        }
        var sapyRet = state.addProjectYarnReturn;
        state.addProjectYarnReturn = null;
        var mergedPatternIds = (sapyRet ? sapyRet.patternCheckedIds : []).concat(newlyPicked);
        openPatternYarnModal(mergedPatternIds);
        break;
      }
      case 'save-pattern-yarn': {
        var spyProj = getProject(state.projectId);
        var spyPat = getPattern(spyProj, state.patternId);
        if(!spyPat) break;
        var pyContainer2 = document.getElementById('pattern-yarn-checklist');
        var newPatYarnIds = readCheckedYarnIds(pyContainer2);
        spyPat.yarnIds = newPatYarnIds;
        touch(spyProj); persist(spyProj, spyPat);
        var stillHasActive = !!state.activeColor && db.yarnStash.some(function(y){ return newPatYarnIds.indexOf(y.id)!==-1 && y.hex.toLowerCase()===state.activeColor.toLowerCase(); });
        if(!newPatYarnIds.length){
          state.activeColor = null;
        } else if(!stillHasActive){
          var firstYarn = getYarn(newPatYarnIds[0]);
          if(firstYarn) state.activeColor = firstYarn.hex;
        }
        closeModal();
        render();
        break;
      }
      case 'clear-grid': {
        var prj3 = getProject(state.projectId);
        var pat = getPattern(prj3, state.patternId);
        if(!pat) break;
        if(confirm('Clear the entire grid? (You can Undo this afterward.)')){
          pushUndoSnapshot(pat);
          pat.cells = blankCells(pat.rows, pat.cols);
          touch(prj3); persist(prj3, pat); render();
        }
        break;
      }
      case 'save-pattern-settings': {
        var prj4 = getProject(state.projectId);
        var pat2 = getPattern(prj4, state.patternId);
        if(!pat2 || !state.patternSettingsDraft) break;
        var nr = clamp(parseInt(document.getElementById('draft-rows').value,10)||pat2.rows,1,100);
        var nc = clamp(parseInt(document.getElementById('draft-cols').value,10)||pat2.cols,1,100);
        var sizeChanged = (nr!==pat2.rows || nc!==pat2.cols);
        if(sizeChanged){
          if(nr<pat2.rows || nc<pat2.cols){
            if(!confirm('Shrinking the grid will permanently remove stitches outside the new size. Continue?')) break;
          }
          pushUndoSnapshot(pat2);
          pat2.cells = resizeCells(pat2.cells, pat2.rows, pat2.cols, nr, nc);
          pat2.rows = nr; pat2.cols = nc;
          pat2.cellSize = fitCellSize(nc, state.patternSettingsDraft.aspect);
        }
        pat2.numbering = state.patternSettingsDraft.numbering;
        pat2.aspect = state.patternSettingsDraft.aspect;
        if(state.patternSettingsDraft.direction !== (pat2.stitchDirection||'horizontal')){
          pat2.guidePos = 0;
        }
        pat2.stitchDirection = state.patternSettingsDraft.direction;
        touch(prj4); persist(prj4, pat2);
        state.patternSettingsOpen = false;
        state.patternSettingsDraft = null;
        closeModal();
        render();
        break;
      }
      case 'cancel-pattern-settings': {
        state.patternSettingsOpen = false;
        state.patternSettingsDraft = null;
        closeModal();
        render();
        break;
      }
      case 'zoom-in': {
        var prjZI = getProject(state.projectId);
        var patZI = getPattern(prjZI, state.patternId);
        if(!patZI) break;
        zoomPatternAroundPoint(prjZI, patZI, clamp(patZI.cellSize+4, CELL_SIZE_MIN, CELL_SIZE_MAX));
        break;
      }
      case 'zoom-out': {
        var prjZO = getProject(state.projectId);
        var patZO = getPattern(prjZO, state.patternId);
        if(!patZO) break;
        zoomPatternAroundPoint(prjZO, patZO, clamp(patZO.cellSize-4, CELL_SIZE_MIN, CELL_SIZE_MAX));
        break;
      }
      case 'guide-toggle': {
        var gtProj = getProject(state.projectId);
        var gtPat = getPattern(gtProj, state.patternId);
        state.guideActive = !state.guideActive;
        if(state.guideActive && gtPat){
          var gtOrder = getGuideOrder(gtPat);
          var gtSaved = clamp(gtPat.guidePos||0, 0, gtOrder.length-1);
          state.guidePos = gtSaved;
          state.guideResumed = gtSaved > 0;
        } else {
          state.guidePos = 0;
          state.guideResumed = false;
        }
        render();
        if(state.guideActive) scrollGuideIntoView();
        break;
      }
      case 'guide-revert': {
        var grProj = getProject(state.projectId);
        var grPat = getPattern(grProj, state.patternId);
        state.guidePos = 0;
        state.guideResumed = false;
        if(grPat){ grPat.guidePos = 0; savePatternDoc(grProj, grPat); }
        render();
        scrollGuideIntoView();
        break;
      }
      case 'guide-prev': {
        var gpProj = getProject(state.projectId);
        var gpPat = getPattern(gpProj, state.patternId);
        state.guidePos = Math.max(0, state.guidePos-1);
        if(gpPat){ gpPat.guidePos = state.guidePos; savePatternDoc(gpProj, gpPat); }
        render();
        scrollGuideIntoView();
        break;
      }
      case 'guide-next': {
        var gnProj = getProject(state.projectId);
        var pp = getPattern(gnProj, state.patternId);
        var gnOrder = getGuideOrder(pp);
        state.guidePos = Math.min(gnOrder.length-1, state.guidePos+1);
        if(pp){ pp.guidePos = state.guidePos; savePatternDoc(gnProj, pp); }
        render();
        scrollGuideIntoView();
        break;
      }
      case 'refresh': {
        renderLoadingScreen('Refreshing…');
        loadEverythingFromFirestore().then(function(){
          db.projects.forEach(function(p){ migrateProjectYarn(p); });
          render();
        }).catch(function(e){
          console.error('Refresh failed', e);
          render();
        });
        break;
      }
      case 'logout': {
        if(confirm('Log out?')){
          db = {projects:[]};
          state.view='home'; state.projectId=null; state.patternId=null;
          auth.signOut();
        }
        break;
      }
      default: break;
    }
  });

  document.addEventListener('input', function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');
    if(action==='set-draft-numbering'){
      if(!state.patternSettingsDraft) return;
      var field = t.getAttribute('data-field');
      var val = t.value;
      state.patternSettingsDraft.numbering[field] = (val==='true') ? true : (val==='false') ? false : val;
      render();
    } else if(action==='set-draft-aspect'){
      if(!state.patternSettingsDraft) return;
      state.patternSettingsDraft.aspect = parseFloat(t.value);
      render();
    } else if(action==='set-draft-direction'){
      if(!state.patternSettingsDraft) return;
      state.patternSettingsDraft.direction = t.value;
      render();
    } else if(action==='set-yarn-stash-group'){
      state.yarnStashGroupBy = t.value;
      render();
    }
  });

  /* two-finger pinch-to-zoom on the grid (touch) */
  function touchDist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
  function endTouchTracking(e){
    if(e.pointerType!=='touch' || !(e.pointerId in state.touchPoints)) return;
    delete state.touchPoints[e.pointerId];
    if(state.pinch && Object.keys(state.touchPoints).length<2){
      state.pinch = null;
      var project = getProject(state.projectId);
      var pattern = getPattern(project, state.patternId);
      if(project && pattern){ touch(project); persist(project, pattern); }
    }
  }

  /* painting via pointer events (mouse + touch) */
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType==='touch' && e.target.closest('.grid-scroll')){
      state.touchPoints[e.pointerId] = {x:e.clientX, y:e.clientY};
      var touchIds = Object.keys(state.touchPoints);
      if(touchIds.length===2){
        var pinchProject = getProject(state.projectId);
        var pinchPattern = getPattern(pinchProject, state.patternId);
        if(pinchPattern){
          if(state.isPainting){
            if(state.strokeSnapshot){
              // an in-progress paint/erase drag — roll it back rather than persist a half-finished stroke
              pinchPattern.cells = state.strokeSnapshot.cells;
              state.strokeSnapshot = null;
            } else if(state.lineStart){
              // a Line drag in progress — it's only a visual preview until pointerup commits it
              // (see commitLine()), so there's nothing painted to keep; discard the undo snapshot
              // pushed at its pointerdown too, since nothing actually changed.
              state.undoStack.pop();
              clearLinePreview();
              state.lineStart = null;
              state.lineCurrent = null;
            } else {
              // a bucket fill already computed its mutation + pushed its undo snapshot synchronously
              // on pointerdown (see paintCell) — it just hadn't reached its normal pointerup
              // persist/render yet, so finish that here instead of leaving it stuck in memory.
              touch(pinchProject); persist(pinchProject, pinchPattern);
            }
            state.isPainting = false;
          }
          var a = state.touchPoints[touchIds[0]], b = state.touchPoints[touchIds[1]];
          state.pinch = {startDist: touchDist(a,b), startCellSize: pinchPattern.cellSize};
        }
        e.preventDefault();
        render();
        return;
      }
      if(touchIds.length>2){ e.preventDefault(); return; }
    }
    var cell = e.target.closest('.cell');
    if(!cell) return;
    if(state.patternMode !== 'edit') return;
    if(state.activeTool === 'pan') return;
    if(state.pinch) return;
    if((state.activeTool==='paint' || state.activeTool==='bucket' || state.activeTool==='line') && !state.activeColor){
      showToast('Select a yarn first');
      return;
    }
    var project = getProject(state.projectId);
    var pattern = getPattern(project, state.patternId);
    if(!pattern) return;
    e.preventDefault();
    state.isPainting = true;
    if(state.activeTool === 'line'){
      var lr = parseInt(cell.getAttribute('data-row'),10), lc = parseInt(cell.getAttribute('data-col'),10);
      pushUndoSnapshot(pattern);
      state.lineStart = {row:lr, col:lc};
      state.lineCurrent = {row:lr, col:lc};
      updateLinePreview(state.lineStart, state.lineCurrent);
      return;
    }
    if(state.activeTool !== 'bucket'){
      state.strokeSnapshot = snapshotPattern(pattern);
    }
    paintCell(project, pattern, parseInt(cell.getAttribute('data-row'),10), parseInt(cell.getAttribute('data-col'),10));
  });
  document.addEventListener('pointermove', function(e){
    if(state.pinch && e.pointerId in state.touchPoints){
      state.touchPoints[e.pointerId] = {x:e.clientX, y:e.clientY};
      var ids = Object.keys(state.touchPoints);
      if(ids.length===2){
        var project = getProject(state.projectId);
        var pattern = getPattern(project, state.patternId);
        if(pattern){
          var a = state.touchPoints[ids[0]], b = state.touchPoints[ids[1]];
          var dist = touchDist(a,b);
          var ratio = dist / state.pinch.startDist;
          var newSize = clamp(Math.round(state.pinch.startCellSize * ratio), CELL_SIZE_MIN, CELL_SIZE_MAX);
          zoomPatternAroundPoint(project, pattern, newSize, (a.x+b.x)/2, (a.y+b.y)/2, true);
        }
      }
      e.preventDefault();
      return;
    }
    if(!state.isPainting) return;
    if(state.activeTool === 'bucket') return; // bucket fires once per gesture, on pointerdown only — a flood fill isn't meant to repeat as you drag, and doing so was stacking redundant undo snapshots
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var cell = el && el.closest ? el.closest('.cell') : null;
    if(!cell) return;
    if(state.activeTool === 'line'){
      if(!state.lineStart) return;
      state.lineCurrent = {row:parseInt(cell.getAttribute('data-row'),10), col:parseInt(cell.getAttribute('data-col'),10)};
      updateLinePreview(state.lineStart, state.lineCurrent);
      return;
    }
    var project = getProject(state.projectId);
    var pattern = getPattern(project, state.patternId);
    if(!pattern) return;
    paintCell(project, pattern, parseInt(cell.getAttribute('data-row'),10), parseInt(cell.getAttribute('data-col'),10));
  });
  function clearLinePreview(){
    var wrapper = document.getElementById('grid-wrapper');
    if(!wrapper) return;
    var marked = wrapper.querySelectorAll('.cell-line-preview');
    for(var i=0;i<marked.length;i++) marked[i].classList.remove('cell-line-preview');
  }
  function updateLinePreview(start, current){
    clearLinePreview();
    var wrapper = document.getElementById('grid-wrapper');
    if(!wrapper) return;
    var path = bresenhamLine(start.row, start.col, current.row, current.col);
    path.forEach(function(rc){
      var cellEl = wrapper.querySelector('.cell[data-row="'+rc[0]+'"][data-col="'+rc[1]+'"]');
      if(cellEl) cellEl.classList.add('cell-line-preview');
    });
  }
  function commitLine(){
    if(!state.lineStart) return;
    var project = getProject(state.projectId);
    var pattern = getPattern(project, state.patternId);
    var end = state.lineCurrent || state.lineStart;
    if(pattern){
      var path = bresenhamLine(state.lineStart.row, state.lineStart.col, end.row, end.col);
      path.forEach(function(rc){ pattern.cells[rc[0]][rc[1]] = state.activeColor; });
    }
    clearLinePreview();
    state.lineStart = null;
    state.lineCurrent = null;
  }
  function endPaint(){
    if(state.isPainting){
      state.isPainting = false;
      var project = getProject(state.projectId);
      var pattern = getPattern(project, state.patternId);
      if(state.strokeSnapshot){
        state.undoStack.push(state.strokeSnapshot);
        if(state.undoStack.length>50) state.undoStack.shift();
        state.redoStack = [];
        state.strokeSnapshot = null;
      }
      if(project){ touch(project); persist(project, pattern); render(); }
    }
  }
  document.addEventListener('pointerup', function(e){ endTouchTracking(e); commitLine(); endPaint(); });
  document.addEventListener('pointercancel', function(e){ endTouchTracking(e); commitLine(); endPaint(); });
  document.addEventListener('pointerleave', function(e){ if(e.target===document.documentElement){ commitLine(); endPaint(); } });

  /* desktop: wheel-over-grid zooms instead of scrolling */
  document.addEventListener('wheel', function(e){
    if(!e.target.closest('.grid-scroll')) return;
    var project = getProject(state.projectId);
    var pattern = getPattern(project, state.patternId);
    if(!pattern) return;
    e.preventDefault();
    var delta = e.deltaY > 0 ? -2 : 2;
    var newSize = clamp(pattern.cellSize + delta, CELL_SIZE_MIN, CELL_SIZE_MAX);
    zoomPatternAroundPoint(project, pattern, newSize, e.clientX, e.clientY);
  }, {passive:false});

  /* keyboard nav for guide mode */
  document.addEventListener('keydown', function(e){
    if(!state.guideActive) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
    var project = getProject(state.projectId);
    var pattern = getPattern(project, state.patternId);
    if(!pattern) return;
    var kdOrder = getGuideOrder(pattern);
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){
      state.guidePos = Math.min(kdOrder.length-1, state.guidePos+1);
      pattern.guidePos = state.guidePos; savePatternDoc(project, pattern);
      render(); scrollGuideIntoView(); e.preventDefault();
    } else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
      state.guidePos = Math.max(0, state.guidePos-1);
      pattern.guidePos = state.guidePos; savePatternDoc(project, pattern);
      render(); scrollGuideIntoView(); e.preventDefault();
    }
  });

  /* ================= AUTH / BOOT ================= */
  function renderLoginScreen(errorMsg){
    var accountId = state.loginAccountId || LOGIN_ACCOUNTS[0].id;
    var accountButtonsHtml = LOGIN_ACCOUNTS.map(function(a){
      return '<button type="button" class="btn btn-sm'+(a.id===accountId?' btn-primary':'')+'" data-login-account="'+a.id+'">'+escapeHtml(a.label)+'</button>';
    }).join('');
    appEl.innerHTML =
      '<div class="login-screen"><div class="login-card">' +
      '<div class="logo" style="font-size:40px;">🧶</div>' +
      '<h1>Mia\'s Crochet Patterns</h1>' +
      '<div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">'+accountButtonsHtml+'</div>' +
      '<p class="hint" style="margin-top:10px;">Enter your passcode to continue</p>' +
      '<form id="login-form">' +
      '<input type="password" id="login-passcode" placeholder="Passcode" autofocus>' +
      (errorMsg ? '<p class="hint" style="color:var(--danger);">'+escapeHtml(errorMsg)+'</p>' : '') +
      '<button type="submit" class="btn btn-primary" style="width:100%;margin-top:14px;">Enter</button>' +
      '</form></div></div>';
    var accountButtons = appEl.querySelectorAll('[data-login-account]');
    for(var i=0;i<accountButtons.length;i++){
      accountButtons[i].addEventListener('click', function(){
        state.loginAccountId = this.getAttribute('data-login-account');
        renderLoginScreen(errorMsg);
      });
    }
    var form = document.getElementById('login-form');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var pass = document.getElementById('login-passcode').value;
      if(!pass) return;
      var acct = LOGIN_ACCOUNTS.filter(function(a){ return a.id===accountId; })[0] || LOGIN_ACCOUNTS[0];
      auth.signInWithEmailAndPassword(acct.email, pass).catch(function(){
        renderLoginScreen('Incorrect passcode. Try again.');
      });
    });
  }

  function renderLoadingScreen(text){
    appEl.innerHTML = '<div class="login-screen"><div class="hint">'+escapeHtml(text||'Loading your patterns…')+'</div></div>';
  }

  /* ================= INIT ================= */
  function loadEverythingFromFirestore(){
    return Promise.all([loadAllFromFirestore(), loadYarnStash(), loadYarnPresets()]).then(function(results){
      db = {projects: results[0].projects, yarnStash: results[1], yarnPresets: results[2]};
    });
  }

  auth.onAuthStateChanged(function(user){
    if(!user){ renderLoginScreen(); return; }
    renderLoadingScreen();
    loadEverythingFromFirestore().then(function(){
      return tryImportLegacyLocalData();
    }).then(function(imported){
      return imported ? loadEverythingFromFirestore() : null;
    }).then(function(){
      db.projects.forEach(function(p){ migrateProjectYarn(p); });
      render();
    }).catch(function(e){
      console.error('Failed to load data', e);
      renderLoadingScreen('Could not load your patterns. Check your connection and reload the page.');
    });
  });
})();
</script>
